spring:
  config:
    activate:
      on-profile: pgvector
  data.jdbc.repositories.enabled: true
  flyway.enabled: true

vector:
  store.type: pgvector
  pgvector:
    table: ${PGVECTOR_TABLE:vector_documents}
    dimension: ${VECTOR_DIMENSION:1024}
    metric: ${VECTOR_METRIC:COSINE}
    hnsw-m: ${HNSW_M:16}
    ef-construction: ${HNSW_EF_CONSTRUCTION:128}
    default-ef-search: ${HNSW_EF_SEARCH:100}
    force-index-scan: ${PGVECTOR_FORCE_INDEX_SCAN:true}

benchmark.container-names: [vector-postgres]
