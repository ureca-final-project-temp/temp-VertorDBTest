spring:
  config:
    activate:
      on-profile: opensearch
  data.jdbc.repositories.enabled: true
  flyway.enabled: true

vector:
  store.type: opensearch
  opensearch:
    base-url: ${OPENSEARCH_URL:http://localhost:9200}
    username: ${OPENSEARCH_USER:}
    password: ${OPENSEARCH_PASSWORD:}
    index: ${OPENSEARCH_INDEX:benchmark-chunks}
    dimension: ${VECTOR_DIMENSION:1024}
    metric: ${VECTOR_METRIC:COSINE}
    engine: ${OPENSEARCH_ENGINE:lucene}
    index-type: ${OPENSEARCH_INDEX_TYPE:hnsw}
    hnsw-m: ${HNSW_M:16}
    ef-construction: ${HNSW_EF_CONSTRUCTION:128}
    default-ef-search: ${HNSW_EF_SEARCH:100}
    ivf-nlist: ${OPENSEARCH_IVF_NLIST:128}
    ivf-model-id: ${OPENSEARCH_IVF_MODEL_ID:benchmark-faiss-ivf}
    training-index: ${OPENSEARCH_TRAINING_INDEX:benchmark-faiss-training}

benchmark.container-names: [vector-opensearch]
