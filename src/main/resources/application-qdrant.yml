spring:
  config:
    activate:
      on-profile: qdrant
  data.jdbc.repositories.enabled: true
  flyway.enabled: true

vector:
  store.type: qdrant
  qdrant:
    base-url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:benchmark_chunks}
    dimension: ${VECTOR_DIMENSION:384}
    metric: ${VECTOR_METRIC:COSINE}
    hnsw-m: ${HNSW_M:16}
    ef-construction: ${HNSW_EF_CONSTRUCTION:128}
    default-ef-search: ${HNSW_EF_SEARCH:100}
    full-scan-threshold: ${QDRANT_FULL_SCAN_THRESHOLD:10}
    indexing-threshold: ${QDRANT_INDEXING_THRESHOLD:10}
    payload-index-fields:
      tenant: keyword
      tenant_id: keyword
      status: keyword
      access_level: keyword
      language: keyword
      category: keyword

benchmark.container-names: [vector-qdrant]
